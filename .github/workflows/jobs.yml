name: AI Jobs (Singapore)

# Manual runs: Actions tab -> "AI Jobs (Singapore)" -> "Run workflow".
on:
  schedule:
    # 09:00 and 18:00 Singapore time (SGT = UTC+8) => 01:00 and 10:00 UTC.
    - cron: "0 1,10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (do not send to Telegram)"
        type: boolean
        default: false
      lookback:
        description: "Lookback window in hours"
        type: string
        default: "168"

# Allow the job to commit the updated dedup state back to the repo.
permissions:
  contents: write

# Never let two scheduled runs race on the state file.
concurrency:
  group: ai-jobs-singapore
  cancel-in-progress: false

jobs:
  jobs-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send jobs feed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: enables the one-line AI "what this role is" note. Without
          # it the bot still runs and uses the posting's own blurb if present.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIJOBS_LOOKBACK_HOURS: ${{ github.event.inputs.lookback || '168' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m aijobs --dry-run --verbose
          else
            python -m aijobs --verbose
          fi

      - name: Commit updated state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update AI jobs dedup state"
            # Retry push to absorb the occasional racing commit.
            for i in 1 2 3 4; do
              git push && break || sleep $((2 ** i))
              git pull --rebase --autostash || true
            done
          else
            echo "No state changes to commit."
          fi
