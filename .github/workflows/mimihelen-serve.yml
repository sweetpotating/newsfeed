name: Mimi Helen Bot — Interactive (reminders + buttons + Q&A)

# A single always-on worker that does EVERYTHING: sends the scheduled reminders,
# answers button taps, commands and questions, and lets you change the schedule
# from chat (/schedule ...). State (doses, streak, schedule, sent-reminders) is
# committed back to the repo so it survives the worker restarting.
#
# How "24/7" works on Actions: a job runs at most ~6h, so the worker runs
# ~5h50m then exits and is restarted (by the schedule below, or any push). The
# bot pushes its own state with the built-in token, which does NOT re-trigger
# this workflow (so no restart loop). Public repos = unlimited minutes = free.
on:
  push:
    branches: ["claude/ai-news-telegram-bot-EBtjH"]   # roll out new code
  schedule:
    - cron: "0 */6 * * *"     # restart every 6 hours
  workflow_dispatch:

# A fresh push/restart takes over the single long-poller (Telegram allows one
# per bot). cancel-in-progress so new code/restarts roll out promptly.
concurrency:
  group: mimihelen-serve
  cancel-in-progress: true

# Needed so the worker can commit dose/schedule state back to the repo.
permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # persist-credentials (default true) lets the bot `git push` its state.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot (~5h50m, then it restarts)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.MIMIHELEN_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.MIMIHELEN_CHAT_ID }}
          MIMIHELEN_FRIEND_NAME: ${{ vars.MIMIHELEN_FRIEND_NAME }}
          MIMIHELEN_TIMES: ${{ vars.MIMIHELEN_TIMES }}
          MIMIHELEN_TZ: ${{ vars.MIMIHELEN_TZ }}
          MIMIHELEN_DAILY_GOAL: ${{ vars.MIMIHELEN_DAILY_GOAL }}
          MIMIHELEN_EYEDROPS: ${{ vars.MIMIHELEN_EYEDROPS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Commit dose/schedule state back so it survives restarts.
          MIMIHELEN_GIT_PERSIST: "1"
        run: |
          timeout 350m python -m mimihelen serve --verbose || code=$?
          if [ "${code:-0}" -eq 124 ] || [ "${code:-0}" -eq 0 ]; then
            echo "Worker window ended; it will restart."
            exit 0
          fi
          echo "Worker exited with code $code"
          exit "$code"
