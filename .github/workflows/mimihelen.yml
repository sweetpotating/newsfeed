name: Mimi Helen Bot — Eyedrop Reminders

# Sends an eyedrop reminder to Telegram at each scheduled dose time.
# Manual runs: Actions tab -> this workflow -> "Run workflow".
#
# IMPORTANT: cron below is in UTC. The defaults map to Singapore time (UTC+8):
#   07:00, 12:00, 18:00, 22:00 SGT  ==  23:00, 04:00, 10:00, 14:00 UTC
# Keep MIMIHELEN_TIMES (in MIMIHELEN_TZ) in sync with these cron lines so each
# run maps cleanly to a dose slot. Change both if you change the schedule.
on:
  schedule:
    - cron: "0 23 * * *"   # 07:00 SGT — dose 1 (with how-to)
    - cron: "0 4 * * *"    # 12:00 SGT — dose 2
    - cron: "0 10 * * *"   # 18:00 SGT — dose 3
    - cron: "0 14 * * *"   # 22:00 SGT — dose 4
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (do not send to Telegram)"
        type: boolean
        default: false
      force:
        description: "Send even if no slot is due right now"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mimihelen-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional overrides (otherwise sensible defaults are used):
          MIMIHELEN_FRIEND_NAME: ${{ vars.MIMIHELEN_FRIEND_NAME }}
          MIMIHELEN_TIMES: ${{ vars.MIMIHELEN_TIMES }}
          MIMIHELEN_TZ: ${{ vars.MIMIHELEN_TZ }}
          MIMIHELEN_DAILY_GOAL: ${{ vars.MIMIHELEN_DAILY_GOAL }}
        run: |
          ARGS="remind --verbose"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python -m mimihelen $ARGS

      - name: Commit updated tracker state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update Mimi Helen reminder state"
            for i in 1 2 3 4; do
              git push && break || sleep $((2 ** i))
              git pull --rebase --autostash || true
            done
          else
            echo "No state changes to commit."
          fi
