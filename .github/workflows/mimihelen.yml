name: Mimi Helen Bot — Eyedrop Reminders (manual / backup)

# NOTE: the always-on "Interactive" worker (mimihelen-serve.yml) now sends the
# scheduled reminders itself AND lets you change the schedule from chat, so this
# scheduled cron is DISABLED to avoid double reminders. Kept as a manual
# send/preview tool only — Actions tab -> Run workflow.
#
# Do not re-enable the schedule below while the Interactive worker is running.
on:
  # schedule:            # intentionally disabled — the serve worker handles it
  #   - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (do not send to Telegram)"
        type: boolean
        default: false
      force:
        description: "Send even if no slot is due right now"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mimihelen-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send reminder
        env:
          # Mimi Helen has its OWN bot + chat, separate from the AI-news bot,
          # so it uses dedicated secrets (add these under repo Settings →
          # Secrets and variables → Actions):
          TELEGRAM_BOT_TOKEN: ${{ secrets.MIMIHELEN_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.MIMIHELEN_CHAT_ID }}
          # Optional overrides (otherwise sensible defaults are used):
          MIMIHELEN_FRIEND_NAME: ${{ vars.MIMIHELEN_FRIEND_NAME }}
          MIMIHELEN_TIMES: ${{ vars.MIMIHELEN_TIMES }}
          MIMIHELEN_TZ: ${{ vars.MIMIHELEN_TZ }}
          MIMIHELEN_DAILY_GOAL: ${{ vars.MIMIHELEN_DAILY_GOAL }}
        run: |
          ARGS="remind --verbose"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python -m mimihelen $ARGS

      - name: Commit updated tracker state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update Mimi Helen reminder state"
            for i in 1 2 3 4; do
              git push && break || sleep $((2 ** i))
              git pull --rebase --autostash || true
            done
          else
            echo "No state changes to commit."
          fi
