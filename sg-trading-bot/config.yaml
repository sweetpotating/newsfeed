# ═══════════════════════════════════════════════════════════════════════════
# sg-trading-bot — AGGRESSIVE profile.
#
# Tuned for higher growth + higher tactical activity than the balanced default:
#   - more capital in momentum (trend) and mean-reversion (tactical dips)
#   - no dedicated bond ballast; smaller dividend sleeve
#   - higher per-position cap, thinner cash buffer, faster signals
#   - a DEEPER drawdown is tolerated before the circuit breaker halts buying
#
# This profile can lose more in a downturn — that is the trade-off of "aggressive".
# The previous balanced config is preserved in git history if you want it back.
#
# No secrets here (safe to commit). Credentials live in .env.
# ═══════════════════════════════════════════════════════════════════════════

base_currency: USD

# Aggressive split: growth core + a large tactical satellite.
#   45% ETF DCA (pure equity, no bonds)  -> still the compounding base
#   10% dividend                          -> small income tilt
#   30% momentum                          -> ride sustained up-trends hard
#   15% mean-reversion                    -> buy oversold dips in uptrends
sleeves:
  etf_dca:        {enabled: true,  weight: 0.45}
  dividend:       {enabled: true,  weight: 0.10}
  momentum:       {enabled: true,  weight: 0.30}
  mean_reversion: {enabled: true,  weight: 0.15}

universes:
  # Pure-equity core (bonds removed for aggressive). All fractional-share
  # friendly at IBKR, so small accounts can still fill them.
  etf_dca:
    - {symbol: VWRA, exchange: LSEETF, currency: USD, name: Vanguard FTSE All-World UCITS}
    - {symbol: CSPX, exchange: LSEETF, currency: USD, name: iShares Core S&P 500 UCITS}
    - {symbol: QQQ,  exchange: NASDAQ, currency: USD, name: Invesco QQQ (Nasdaq-100)}

  # Dividend / income. US dividend ETFs only by default — they support
  # fractional shares, unlike SGX 100-share lots. Re-add D05/O39/U11 (SGX) once
  # your account is large enough to buy lots cleanly (~US$20k+).
  dividend:
    - {symbol: VYM,  exchange: ARCA,  currency: USD, name: Vanguard High Dividend Yield ETF}
    - {symbol: SCHD, exchange: ARCA,  currency: USD, name: Schwab US Dividend Equity ETF}
    # - {symbol: D05, exchange: SGX, currency: SGD, name: DBS Group}     # 100-share lots
    # - {symbol: O39, exchange: SGX, currency: SGD, name: OCBC}          # 100-share lots
    # - {symbol: U11, exchange: SGX, currency: SGD, name: UOB}           # 100-share lots

  # Momentum / trend-following on liquid, high-beta names.
  momentum:
    - {symbol: SPY,  exchange: ARCA,  currency: USD, name: SPDR S&P 500}
    - {symbol: QQQ,  exchange: NASDAQ,currency: USD, name: Invesco QQQ}
    - {symbol: SMH,  exchange: NASDAQ,currency: USD, name: VanEck Semiconductor ETF}
    - {symbol: EFA,  exchange: ARCA,  currency: USD, name: iShares MSCI EAFE}
    - {symbol: GLD,  exchange: ARCA,  currency: USD, name: SPDR Gold}

  # Mean-reversion: buy oversold dips inside an uptrend.
  mean_reversion:
    - {symbol: SPY,  exchange: ARCA,  currency: USD, name: SPDR S&P 500}
    - {symbol: QQQ,  exchange: NASDAQ,currency: USD, name: Invesco QQQ}
    - {symbol: SMH,  exchange: NASDAQ,currency: USD, name: VanEck Semiconductor ETF}
    - {symbol: IWM,  exchange: ARCA,  currency: USD, name: iShares Russell 2000}

strategy_params:
  etf_dca:
    rebalance_days: 30
    drift_band: 0.05
  dividend:
    rebalance_days: 30
    drift_band: 0.05
  momentum:
    lookback_days: 90         # faster signal than the 126d balanced default
    sma_filter_days: 150      # looser trend filter -> gets in earlier
    top_n: 3                  # hold more of the strong names
  mean_reversion:
    rsi_period: 14
    rsi_buy_below: 35         # start accumulating dips a bit earlier
    rsi_sell_above: 70
    sma_filter_days: 150

# ── Risk limits — AGGRESSIVE (still NO leverage by default) ─────────────────
risk:
  max_position_pct: 0.35      # allow bigger single-name bets (was 0.25)
  max_gross_exposure: 1.0     # still <=100% invested; no margin by default
  min_cash_pct: 0.01          # run nearly fully invested
  min_trade_value: 200
  max_daily_turnover: 0.50    # rebalance faster (was 0.35)
  max_drawdown_halt: 0.30     # tolerate a deeper drawdown before halting buys

schedule:
  run_cron: "0 22 * * 1-5"    # 22:00 UTC weekdays
