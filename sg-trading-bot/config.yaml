# ═══════════════════════════════════════════════════════════════════════════
# sg-trading-bot — strategy, universe and risk configuration.
#
# This file is safe to edit and commit (it holds NO secrets). Tune the sleeve
# weights, universes and risk limits here; credentials live in .env.
# ═══════════════════════════════════════════════════════════════════════════

# Base currency for accounting and target sizing. IBKR will FX-convert as needed.
base_currency: USD

# How the total portfolio capital is split across the four strategy "sleeves".
# Weights are normalised, so they need not sum to exactly 1.0.
#
# Rationale for the default split (a "core-satellite" design):
#   - 55% long-term ETF DCA   -> the compounding core (low cost, broad market)
#   - 20% dividend equities   -> income + lower volatility ballast
#   - 15% momentum            -> participate in sustained up-trends
#   - 10% mean-reversion       -> tactical, smaller because it trades more
sleeves:
  etf_dca:        {enabled: true,  weight: 0.55}
  dividend:       {enabled: true,  weight: 0.20}
  momentum:       {enabled: true,  weight: 0.15}
  mean_reversion: {enabled: true,  weight: 0.10}

# ── Universes ────────────────────────────────────────────────────────────────
# Symbols use IBKR's "SYMBOL-EXCHANGE-CURRENCY" convention so the same string
# works for the broker and (where possible) the data provider.
universes:
  # Long-term core. Defaults to Irish-domiciled UCITS ETFs, which are generally
  # tax-efficient for Singapore-based investors (treaty 15% dividend withholding,
  # no US estate-tax exposure). Swap to US-listed VOO/VTI/VT if you prefer.
  etf_dca:
    - {symbol: VWRA, exchange: LSEETF, currency: USD, name: Vanguard FTSE All-World UCITS}
    - {symbol: CSPX, exchange: LSEETF, currency: USD, name: iShares Core S&P 500 UCITS}
    - {symbol: AGGG, exchange: LSEETF, currency: USD, name: iShares Core Global Aggregate Bond UCITS}

  # Dividend / income. Mix of SGX blue chips + a broad US dividend ETF.
  dividend:
    - {symbol: D05,  exchange: SGX,   currency: SGD, name: DBS Group}
    - {symbol: O39,  exchange: SGX,   currency: SGD, name: OCBC}
    - {symbol: U11,  exchange: SGX,   currency: SGD, name: UOB}
    - {symbol: VYM,  exchange: ARCA,  currency: USD, name: Vanguard High Dividend Yield ETF}

  # Momentum / trend-following on liquid US ETFs.
  momentum:
    - {symbol: SPY,  exchange: ARCA,  currency: USD, name: SPDR S&P 500}
    - {symbol: QQQ,  exchange: NASDAQ,currency: USD, name: Invesco QQQ}
    - {symbol: EFA,  exchange: ARCA,  currency: USD, name: iShares MSCI EAFE}
    - {symbol: GLD,  exchange: ARCA,  currency: USD, name: SPDR Gold}

  # Mean-reversion on the same liquid names (buys oversold, trims overbought).
  mean_reversion:
    - {symbol: SPY,  exchange: ARCA,  currency: USD, name: SPDR S&P 500}
    - {symbol: QQQ,  exchange: NASDAQ,currency: USD, name: Invesco QQQ}
    - {symbol: IWM,  exchange: ARCA,  currency: USD, name: iShares Russell 2000}

# ── Strategy parameters ────────────────────────────────────────────────────
strategy_params:
  etf_dca:
    # Equal-weight the ETF universe; rebalance back to target on a cadence.
    rebalance_days: 30
    drift_band: 0.05          # only trade a holding if it drifts >5% from target
  dividend:
    rebalance_days: 30
    drift_band: 0.05
  momentum:
    lookback_days: 126        # ~6 months
    sma_filter_days: 200      # only hold names above their 200d SMA (trend filter)
    top_n: 2                  # hold the strongest N names in the sleeve
  mean_reversion:
    rsi_period: 14
    rsi_buy_below: 30         # accumulate when oversold
    rsi_sell_above: 70        # trim when overbought
    sma_filter_days: 200      # only buy dips that are still in a long-term uptrend

# ── Risk limits (applied to the COMBINED target across all sleeves) ──────────
risk:
  max_position_pct: 0.25      # no single symbol may exceed 25% of equity
  max_gross_exposure: 1.0     # no leverage by default (<=100% invested)
  min_cash_pct: 0.02          # always keep >=2% cash buffer
  min_trade_value: 200        # skip trades smaller than this (avoid fee drag)
  max_daily_turnover: 0.35    # cap total $ traded per run at 35% of equity
  # Circuit breaker: if equity falls this far below its trailing peak, stop
  # opening/increasing positions until it recovers (only de-risking allowed).
  max_drawdown_halt: 0.20

# ── Scheduling ───────────────────────────────────────────────────────────────
schedule:
  # The engine is idempotent: running it more often just re-checks drift bands.
  # Daily after US close is a sensible default for these daily-bar strategies.
  run_cron: "0 22 * * 1-5"    # 22:00 UTC, weekdays
