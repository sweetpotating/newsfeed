# Scheduled paper-trading rebalance + CI for sg-trading-bot.
#
# By default this runs in PAPER mode with the offline synthetic data provider,
# so it works with NO secrets configured. To trade your IBKR *paper* account or
# use real market data, add repository secrets and adjust the env below — but
# note that scheduled cloud runs cannot reach a TWS/IB Gateway running on your
# own machine. For live/paper IBKR execution, run the engine where Gateway runs.
name: sg-trading-bot

on:
  workflow_dispatch:
  push:
    paths:
      - "sg-trading-bot/**"
  schedule:
    # 22:00 UTC weekdays — keep in sync with config.yaml schedule.run_cron.
    - cron: "0 22 * * 1-5"

defaults:
  run:
    working-directory: sg-trading-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -q

  rebalance:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SGTRADER_MODE: paper
      SGTRADER_DATA_PROVIDER: synthetic
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run paper rebalance
        run: python -m sgtrader rebalance
      - name: Persist paper account state
        run: |
          git config user.name "sg-trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ || true
          git commit -m "chore: update paper trading state [skip ci]" || echo "no changes"
          git push || echo "push skipped"
